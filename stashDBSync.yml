name: StashDB Sync
description: Pushes performer and studio favorites from Stash up to the matching stash-boxes (StashDB, etc.) via their stash_ids.
url: https://codeberg.org/surging9143/StashDBSync
version: 0.1.0
exec:
  - python3
  - "{pluginDir}/stashDBSync.py"
interface: raw
tasks:
  - name: Sync All Favorites
    description: Pushes the current favorite state of every linked performer and studio up to their stash-boxes.
    defaultArgs:
      mode: syncAll
  - name: Pull Favorites from StashDB
    description: Marks local performers and studios as favorite when they are favorited upstream (additive; never unfavorites).
    defaultArgs:
      mode: pullFavorites
settings:
  sync_performers:
    displayName: "Sync Performers"
    description: "When a performer is updated, push its favorite state to matching stash-boxes."
    type: BOOLEAN
  sync_studios:
    displayName: "Sync Studios"
    description: "When a studio is updated, push its favorite state to matching stash-boxes."
    type: BOOLEAN
  verbose:
    displayName: "Verbose Logging"
    description: "Log skipped entities (no stash_id, no matching stash-box) in addition to actual syncs."
    type: BOOLEAN
hooks:
  - name: Sync favorite on update
    description: Pushes favorite state upstream when a performer or studio is updated.
    triggeredBy:
      - Performer.Update.Post
      - Studio.Update.Post
